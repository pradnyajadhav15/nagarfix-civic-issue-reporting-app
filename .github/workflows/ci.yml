# Builds and tests all three apps on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (Spring Boot + PostGIS)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgis:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_URL: jdbc:postgresql://localhost:5432/nagarfix
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # Runs ApiIntegrationTests: safe here because this database is thrown away after the run
      INTEGRATION_TESTS: "true"
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: api/pom.xml

      - name: Create an empty database (Flyway adds PostGIS and the tables, like on Neon)
        run: docker exec ${{ job.services.postgis.id }} psql -U postgres -c "CREATE DATABASE nagarfix"

      - name: Make a throwaway JWT secret
        run: echo "JWT_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Test summary
        if: always()
        shell: python3 {0}
        run: |
          # One line per test class (shown on the run's page), plus the reason for each failed test
          import glob, xml.etree.ElementTree as ET
          for path in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
              suite = ET.parse(path).getroot()
              name = suite.get("name").rsplit(".", 1)[-1]
              tests, skipped = int(suite.get("tests")), int(suite.get("skipped"))
              failed = int(suite.get("failures")) + int(suite.get("errors"))
              print(f"::notice title={name}::{tests} tests, {failed} failed, {skipped} skipped")
              for case in suite.iter("testcase"):
                  for problem in list(case.iter("failure")) + list(case.iter("error")):
                      message = (problem.get("message") or problem.text or "").replace("\n", " ")[:400]
                      print(f"::error title={name}.{case.get('name')}::{message}")

  web:
    name: Web (Next.js)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  ml:
    name: ML service (FastAPI)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ml/requirements*.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Test
        run: python -m pytest
