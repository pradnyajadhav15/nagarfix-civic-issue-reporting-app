spring.application.name=nagarfix-api

# Local secrets live in api/.env (git-ignored). On Render they are environment variables.
spring.config.import=optional:file:.env[.properties]

# Render provides PORT in production; locally it defaults to 8080
server.port=${PORT:8080}

# --- Database (Neon Postgres + PostGIS) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Small pool; idle connections close after 60s so Neon can sleep and save free compute hours
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000

# Tables are created by Flyway migrations (src/main/resources/db/migration), not by Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# Websites allowed to call this API from a browser (comma-separated, * allowed)
app.cors.allowed-origin-patterns=${CORS_ORIGIN_PATTERNS:http://localhost:3000,https://nagarfix*.vercel.app}

# --- Auth (JWT signed with a secret key) ---
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-hours=168

# First admin account - created at startup if it does not exist yet
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
