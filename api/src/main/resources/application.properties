spring.application.name=nagarfix-api

# Render provides PORT in production; locally it defaults to 8080
server.port=${PORT:8080}

management.endpoints.web.exposure.include=health,info

# Websites allowed to call this API from a browser (comma-separated, * allowed)
app.cors.allowed-origin-patterns=${CORS_ORIGIN_PATTERNS:http://localhost:3000,https://nagarfix*.vercel.app}
